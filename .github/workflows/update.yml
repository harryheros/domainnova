name: Update DomainNova Dataset

on:
  schedule:
    - cron: "0 2 * * 1"    # Weekly: every Monday 02:00 UTC (build)
    - cron: "0 3 1 * *"    # Monthly: 1st of month 03:00 UTC (discovery agents + build)
    - cron: "30 3 * * 4"   # Weekly: Thursday — state cache keep-alive only
  workflow_dispatch:
    inputs:
      run_agents:
        description: "Run discovery agents (yes/no)"
        required: false
        default: "no"

# Never let two dataset builds race on the same branch (manual + scheduled).
concurrency:
  group: domainnova-update-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # GitHub evicts caches not accessed for 7 days — exactly the build period —
  # so the pipeline state was routinely gone by the next Monday. A mid-week
  # restore counts as an access and keeps it alive.
  cache-keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '30 3 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch pipeline state cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/discovery_stats.json
            data/domains.csv
          key: domainnova-state-keepalive-${{ github.run_id }}
          restore-keys: |
            domainnova-state-

  update:
    if: github.event_name != 'schedule' || github.event.schedule != '30 3 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: sources/scripts
        run: python -m unittest discover -p "test_*.py" -q

      - name: Validate manual sources
        run: python sources/scripts/validate_manual_sources.py

      # Pipeline state that must survive between runs but is not committed:
      #   data/discovery_stats.json — discovery rotation offset and the
      #       promote / purge / dead-domain streak counters
      #   data/domains.csv          — previous run, used for sticky fallback
      # v3.4 cached only the first file, under a fixed key. Actions caches are
      # immutable, so every save after the first was rejected and the same
      # stale snapshot was restored forever: promote/purge never triggered,
      # and sticky fallback never had a previous run to fall back to.
      - name: Restore pipeline state
        uses: actions/cache/restore@v5
        with:
          path: |
            data/discovery_stats.json
            data/domains.csv
          key: domainnova-state-${{ github.run_id }}
          restore-keys: |
            domainnova-state-

      # Discovery agents - run monthly or on manual trigger
      - name: Run discovery agents
        if: |
          github.event.schedule == '0 3 1 * *' ||
          github.event.inputs.run_agents == 'yes'
        env:
          # Optional: set a repo secret to enable the ViewDNS JSON API fallback.
          VIEWDNS_APIKEY: ${{ secrets.VIEWDNS_APIKEY }}
        run: |
          mkdir -p sources/discovery_agents
          # Discovery uses neutral infrastructure sources only:
          # IP-neighbor (reverse-IP on IPNova's own CN ranges) + CT logs.
          echo "[+] Running IP neighbor agent..."
          python sources/discovery_agents/agent_ip_neighbor.py
          echo "[+] Running CT logs agent..."
          python sources/discovery_agents/agent_ct_logs.py

      - name: Build domain artifacts
        run: python sources/scripts/build_domains.py

      - name: Build metadata artifacts
        run: python sources/scripts/build_metadata.py --all

      - name: Show stats
        run: |
          echo "=== Stats ==="
          [ -f data/stats.json ] && cat data/stats.json || echo "stats.json missing"
          echo ""
          for region in cn hk mo tw jp kr sg; do
            f="dist/domains_${region}.txt"
            echo "=== $f (first 10 lines) ==="
            if [ -f "$f" ]; then
              head -10 "$f"
              echo "  -- total lines: $(grep -cv '^#' "$f" | head -1)"
            else
              echo "$f missing"
            fi
            echo ""
          done
          echo "=== discovery.txt count ==="
          [ -f sources/manual/discovery.txt ] && \
            grep -v "^#" sources/manual/discovery.txt | grep -v "^$" | wc -l || \
            echo "discovery.txt missing"

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add the entire data/ and dist/ directories plus the manually-
          # modified discovery/extended source files.
          git add data/ dist/ \
            sources/manual/discovery.txt \
            sources/manual/extended.txt
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          git commit -m "chore: auto-update $(date -u +%Y-%m-%d)"
          # The build takes a while; someone may have pushed meanwhile.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt), rebasing"
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done
          echo "::error::failed to push after 3 attempts"
          exit 1

      - name: Save pipeline state
        uses: actions/cache/save@v5
        # Only after the whole job succeeded (incl. push): otherwise counters
        # could record promotions/purges whose file changes were never pushed.
        # The next run then retries from the last good state.
        if: success() && hashFiles('data/discovery_stats.json') != ''
        with:
          path: |
            data/discovery_stats.json
            data/domains.csv
          key: domainnova-state-${{ github.run_id }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: update
    if: ${{ failure() }}
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Create failure issue
        # v7 ran on Node 20, which GitHub removed from hosted runners on
        # 2026-09-16 — the failure notifier itself would no longer run.
        uses: actions/github-script@v9
        with:
          script: |
            const title = `DomainNova update failed — ${new Date().toISOString().split('T')[0]}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## DomainNova automated update failed',
              '',
              `**Workflow run:** ${runUrl}`,
              '',
              'Possible causes:',
              '- DoH upstream unavailable or DNS resolution degraded',
              '- ipnova CIDR data unavailable or corrupted',
              '- Discovery agent failure',
              '- Unit tests or manual source validation failed',
              '',
              'Please investigate the workflow logs and re-run manually if needed.',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 5,
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another failed run: ${runUrl}`,
              });
            }
